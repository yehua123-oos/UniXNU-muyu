# Board description of the Xiaomi Pad 7 Pro (muyu, SM8635 cliffs), read by the unixnu build driver.
# Derived from UniXNU-braveark (same SM8635 SoC); the SoC-level values below are shared with it.

[board]
name = "muyu"
soc = "SM8635"
description = "Xiaomi Pad 7 Pro"
kit = "muyu"                 # the package/ of this repository appears as kits/braveark in the build tree

# The target OS image: the unchanged iPad7,1 iPadOS 17.7.11 restore image. Give --ipsw PATH to use a local file; without
# it the remote url is read with range requests, only the members that are needed.
[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]   # the small components

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

# The raw image for the userdata partition: the OS and SystemOS disk images of the IPSW behind a manifest.
# The GPT entry "userdata" (sda32) of LUN 0. **Derive these from the live GPT every time**: this device's
# `super` was enlarged once, which moved userdata 2.10 GiB later and changed its size. The values below are
# from the running system (2026-10-24):
#   /sys/block/sda/sda32/start = 23691264 sectors (512 B) -> first_lba = 23691264 / 8 = 0x2d3000
#   /sys/block/sda/sda32/size  = 471908312 sectors       -> 58988539 blocks of 4096 B
#   last_lba = first_lba + blocks - 1 = 0x3b147fa
# The previous BSP values (0x24c628..0x3a8b7fa) now point *inside* the current super partition
# (0x33000..0x2d2fff): using them would overwrite Android's dynamic partitions.
[userdata]
first_lba = 0x2d3000
last_lba = 0x3b147fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
# Userland stage: the full kernel plus the owner cache/Data mounts, the RAM block
# provider (the Data seed) and the launchd watchdog policy. Under muyu-full_defconfig
# launchd has no writable /private/var (swap reports EROFS 30) and nothing holds the
# watchdog, so the console stops after load_init_program and the board resets.
defconfig = "muyu-userland_defconfig"
# Archive builders of the kernel step, in order. They run only for a configuration with
# CONFIG_XNU_BUILD_ARCHIVES=y (configs/braveark-full_defconfig), after the bootstrap pass has left the
# compile records behind. Each entry is a script of the build tree with its arguments.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-arm-driver.py ArmDTPlatform",
  "build-arm-driver.py ArmCpu",
  # Userland stage: the AES subclass the storage stack wants (CONFIG_XNU_NATIVE_AES).
  "build-arm-driver.py SoftwareAES",
  "build-native-aes-bindings.py",
  "prepare-storage-headers.py",
  "build-arm-driver.py ShengUfs --unverified",
  "build-ufs-original-bindings.py",
  # The Data seed's typed provider: the packed DBRDISK1 that DarwinBoot hands over is
  # published by RamBlock, which native_owner_data_prepare() mounts on /private/var.
  "build-arm-driver.py RamBlock",
  # RamBlock needs the original IOBlockStorageDevice aliases, but the UFS binder
  # below already emits them (same pinned candidate, same class, identical .set values).
  # A second copy of original-bindings.o is 11 duplicate symbols at link time, so the
  # RAM block archive keeps only its own object and resolves the aliases from libNativeUfs.a.
  # Upstream's build-native-virtio-bindings.py would need the live storage snapshot
  # (build/storage-abi/interface-audit.json), which this board does not have.
  # CONFIG_XNU_SOURCE_MOCKFS: the minimal executable-root filesystem for offline mounts.
  "build-mockfs-fixture.py",
  "build-native-legacy-display.py",
  # pthread is needed by pthread_shims (kernel panics without it at pthread_shims.c:318).
  # Turned on together with CONFIG_XNU_SOURCE_PTHREAD in the board configuration.
  "build-libpthread-kernel.py",
  # AMFI panics with "No PMGR?" unless an ApplePMGRNub exists; this kit is the
  # original-PMGR integration it wants. Paired with CONFIG_XNU_SHENG_PMGR=y and the
  # sheng-pmgr=2 boot argument.
  "build-sheng-platform-power.py",
  # CONFIG_XNU_BOOT_LOG / CONFIG_XNU_WATCHDOG_POLICY: the pram log writer (the next boot
  # prints "PREVIOUS XNU LOG") and the launchd policy that disables com.apple.watchdogd,
  # so a missing boot-task check-in no longer resets the board.
  "build-boot-log.py",
  # "build-muyu-usb-debug.py" was removed from this list on 2026-11-08 along with the driver
  # (docs/ABANDONED-CHANNELS.md); leaving a manifest entry for a missing script would have made
  # the build fail at the first driver that cannot be produced.
  # muyu-thermal=<n>: read-only TSENS survey (package/MuyuThermalProbe.c). Its decode and the
  # panel row are host-tested by scripts/check-muyu-thermal-host.py, which also re-derives the
  # controller bases and the sensor map from fw/muyu_dt.txt so the header cannot drift.
  "build-muyu-thermal.py",
  # Native Adreno 735 (SM8635 cliffs): regenerate the pinned GMU/SMMU/OPP sources from the harvested
  # firmware + devicetree, then compile+link uke's iPadOS 27 driver baseline against 21H461.
  # gen-muyu-gpu-platform.py must run first: the other three consume its build/gpu/muyu-gpu-platform.json.
  "gen-muyu-gpu-platform.py",
  "gen-muyu-gmu-source.py",
  "gen-muyu-gmu-votes.py",
  "gen-muyu-gpu-smmu-source.py",
  "build-arm-driver.py Adreno740",
  # Staged AGXAccelerator (the IOAcceleratorES subclass that publishes MetalPluginName):
  # must run AFTER Adreno740 so it can inject into the freshly built libAdreno740.a.
  # Offline feasibility probe 2026-11-11; remove if the full NATIVE_ADRENO bring-up is not pursued.
  "build-adreno740-accelerator.py",
]

