[gpu.firmware_pins."gen71100_sqe.fw"]
bytes = 66036
sha256 = "b6df660d109504dbea5a266910b037a33d893a11c6de52f524a5fd112008c401"

[gpu.firmware_pins."gen71100_gmu.bin"]
bytes = 80680
sha256 = "435c7bac9a328b8a100df930b84b65b4d579e42be44785d0e60e3729291bb864"

[gpu.firmware_pins."gen71100_zap.mbn"]
bytes = 12088
sha256 = "463ba9b7d2e3f03ac0e6fa6358bf9c886c689b43af14face6a734bf289439fb4"

# Reserved: the ADT needs a matching gmu-memory node and the UEFI memory map a matching
# "GMU Pool" entry (uke: 0xC8000000 / 32 MiB). Both are still to be added on this board.
# <<< gpu table  # profile Adreno732 @ 22abfe46098e

[kernel.prelink]
tool = "kits/XnuPrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
# The 24A446 kernelcache, not 21H461: the fixtures the device archives bind against
# (scripts/data/ipados-27.0.1-24A446/, scripts/check-ipados27-abi-fixtures.py) are keyed to it.
kernelcache_sha256 = "38e6d9fa5f789b8228f4617ef4c6d2a3fd8ab564abdc9b62920f1db53fc1780a"
# The 24A446 kexts are linked at 0xfffffe00…; 0x1f000000000 puts them at 0xfffffff0…, the same final
# region the 21H461 board uses. -0x1000000 (the 21H461 value, inherited by the 27 OS profile) would move
# them to 0xfffffdff…, outside the kernel's mapped window, and every bound slot would be wrong.
slide = "0x1f000000000"
# Unslid, as the prelink emitter takes it and adds the slide.
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffe00092551ac"
# The board's display audits read build/xnu-prelink/<name>.{macho,json}; the prelink stage
# republishes its plan under this name because the fields they verify are the same.
reference_candidate = [
  "native-owner-mobile-graphics-candidate",
  "native-owner-ufs-rootauth3-candidate",
  "native-owner-ufs-cpu-desktop-v9-hid-init-candidate",
  "native-owner-renderbox-presentation-candidate",
  "native-owner-metal-shared-events-candidate",
]
roots = [
