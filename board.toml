[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "muyu"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "muyu-research"

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and
# the optional trust cache and Data seed. The loader (DarwinBoot) is part of the firmware volume.
[payload]
# Bring-up: no menu wait at all; spurious USB input events cancel a countdown.
timeout = 0
# 2026-11-06: SourceStorage.cpp:89 panicked because this was never set. The payload builder only
# copies kernel.macho.vroot and only publishes /chosen/memory-map/RootPolicies when [payload]
# root_policies names the bundle, and native_source_root_policies_load() reads exactly that entry.
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
volume = "MUYUESP"
size_mib = 94
# The boot image this line flashes (UniXNU/out/muyu/boot/boot.img, 2026-10-26) predates
# DarwinBoot's .0/.1 assembly (commit 1598841), so it looks for a single Payloads/kernel.macho.
# The 95.7 MB kernel still fits the 94 MiB volume unsplit.
# split_kernel defaults to true: the rebuilt DarwinBoot reassembles kernel.macho.0/.1.          # fragments mode keeps the 33.8 MB stock ramdisk; 60 MiB still fits the 96 MiB partition
# This board's own ArmCpu owns /cpus. The prelinked AppleARMCPU personality matches by prefix
# (IONameMatch 'cpu' claims cpu0..cpu7) and then validates an Apple device tree this board does
# not have, so the payload step retargets it to 'xpu'. Same length, so no offset in the kernel
# image moves: scripts/patch-prelinked-personality.py.
native_cpu_owner = true
loader = "firmware"
title = "muyu first boot: source 4K XNU to console"
dram_size = "0x80000000"             # SMEM RAM table observed on the device
skip_setup_tool = "scripts/seed-data-skip-setup.py"   # used by --skip-setup
# 2026-11-06: the console clears the screen at init now, so kernel output is readable by itself.
# The renderer is only switched on to draw a short bisect marker (a probe parks the kernel after
# drawing), never for panic text.
panic_screen = true
# 2026-11-06: off for this run - the renderer is now uke's proven one (two-pass, console
# quiesce, writability-clamped clear), so the panic itself is the reading and no probe parks it.
# entry_probe_fb_after = "__ZN9NativeUfs9startRootEP9IOService"
# 2026-11-06: off for this run - the renderer is now uke's proven one (two-pass, console
# quiesce, writability-clamped clear), so the panic itself is the reading and no probe parks it.
# entry_probe_fb_in = "__ZN9NativeUfs5startEP9IOService"
# 2026-11-06: off for this run - the renderer is now uke's proven one (two-pass, console
# quiesce, writability-clamped clear), so the panic itself is the reading and no probe parks it.
# entry_probe_fb_text = "U1"
# 2026-11-06: reading panic text on this panel is a dead end for now (rotation/geometry of the
# renderer do not match the console's). Bisect with the yes/no signal instead: a probe parks the
# kernel after drawing a short marker, so "any text at all" answers "was this call site reached".
# 2026-11-06: the boot now reaches bsd_init and panics there (data abort, write to a bogus
# low pointer). Bisect that window: park right after the call to proc_uuid_policy_init,
# which sits in the middle of bsd_init before IOKitBSDInit.
# One question with a readable answer (scripts/patch-xnu-entry-probe.py --fb-probe-after): after the
# call to initialize_screen() in kernel_bootstrap_thread -- the first call after PE_init_iokit()
# returns -- draw this line through the panic renderer and park. The line on screen means the kernel
# got past IOKit initialisation, where every matching prelinked kext (ArmCpu included) starts; no
# line means the hang is inside PE_init_iokit. The stage bars cover the console, so the boot log from
# this point on cannot be read on the panel at all.
# The panel is black after the boot logo and no text ever appears, while the kernel is
# known to run (reset probes). Two payload-only probes separate the possible causes
# without a kernel rebuild:
#
#  entry_probe_fill  paint the whole panel at kernel entry (MMU still off, the physical
#                    GOP base from boot_args Video[0], no mapping and no console), then
#                    park. A solid colour proves the kernel entry ran and the frame
#                    buffer is reachable; black means either the entry never ran or the
#                    handed-over base is wrong.
#  entry_probe_fb_after
#                    draw one line later, through the panic screen renderer's mapped
#                    vinfo, right after PE_create_console(); proves the mapped path
#                    works even if the video console stays disabled.
# PROVEN 2026-10-24 14:20: the fill probes fires - the kernel entry code runs on this
# device. It parks the kernel, so it is off for normal bring-up; turn it back on to
# confirm the entry again.
# entry_probe_fill = "0xFF00FF00"
# entry_probe_fill_base = "0xE3940000"
# entry_probe_fill_size = "3200x2136"
# Mu-Silicium's GOP base was not the scanned-out buffer (green never appeared), while the
# UEFI text console demonstrably draws on the splash region. Paint that region instead:
# it is the reserve the ABL/AOP hand over, 3200x2136 at 32 bpp.
# entry_probe_fb_after = "_PE_create_console"
# entry_probe_fb_text = "FB PROBE: kernel writes the panel"
# The bundle of the two unchanged original trust-cache modules (static + SystemOS cryptex) of
# **24A446**, extracted from this line's own IPSW with scripts/bundle-ipsw-trust.py: module 0 is
# Firmware/.../043-68950-668.dmg (3547 entries, carries launchd's cdhash 3d2ccf3d...), module 1 is
# 043-69086-713.dmg (130 entries). The 21H461 bundle sheng/17-line accepts does NOT carry the 27
# line's launchd, and with no trust cache at all AMFI kills init with namespace 9 / code 0x8
# (EXEC_EXIT_REASON_SECURITY_POLICY) right after "BSD root: disk5s1". Nothing is added to it.
trust_cache_sha256 = ["dc655bcb2ddfaea214f9ec83659b3fc8d8b658bafac2b5a004fb4179a25c89bf"]
kernel_args = [
  # "-v",   # dropped 2026-10-27: console spam buried the panic dump
  "debug=0x14e",
  # u90: map the shared cache unslid so a raw (un-rebased) chained pointer still names a valid address.
  "-disable_aslr",
  # 2026-11-06 u44: observe AppleImage4's ignition_blob handler, which libignition waits on.
  # NOT WIRED (checked 2026-11-08 across muyu, uke, UniXNU-27, sm8635-common): nothing parses
  # "muyu-ignition-trace". The u44 two-liner lived in /tmp/spike27's bsd/kern/kern_newsysctl.c
  # and was never committed as a patch, so the observation that produced IPADOS27-MIGRATION
  # §6.58.2 ("muyu ignition: enter oldlen=132 newlen=0", never returns) cannot be reproduced
  # from this repo today. To re-run it, port the hook back into patches/xnu-27/ and list it in
  # that directory's series first; the argument alone is inert.
  # "muyu-ignition-trace=1",
  # 2026-11-06 u47: let the ignition handler take over the gate its holder never releases.
  # u50: union composition with ignition off; forcing the gate only produced the cork poll loop.
  # "muyu-ignition-force=1",
  # arm_vm_init maps _start.._end with the contiguous-entries hint; with the 27 fileset layout
  # _end reaches into pages the bootstrap already mapped without the hint, and the assert at
  # arm_vm_init.c:1107 refuses to change the hint bit on an active mapping. Off for bring-up.
  "use_contiguous_hint=0",
  # DEVELOPMENT kernels keep kprintf off unless this is set; this device has no wired UART,
  # so kprintf then falls back to the framebuffer video console. Graphics boot
  # suppresses text until -bravearktextconsole switches the console to text mode.
  # The flag name is fixed by muyu-console-clear.patch (still the BraveArk spelling), which is the
  # patch that switches vcattach() to kPETextScreen: passing -muyutextconsole here is silently
  # ignored, which is why the panel stayed empty while the kernel itself was running fine.
  # (The 17 line's own zzzzzz-video-console-text.patch also parses this name, but it lives in
  # patches/xnu/ — the 17 line's directory, not this line's — so it is not applied here.)
  # "-enable_kprintf_spam",   # dropped 2026-10-27: console spam buried the panic dump
  "-bravearktextconsole",
  # u124: uke 2026-11-03 fix for the text-console stall, ported as
  # UniXNU-muyu style. kprintf no longer draws to the framebuffer with IRQs
  # masked (single-core + ticket lock = silent deadlock); it enqueues to the
  # console ring instead and a thread_call drains it. Panic output stays
  # synchronous.
  # NOT WIRED on this line (checked 2026-11-08): the argument name below is not parsed anywhere
  # in this repo, and uke's implementation reads "-ukedeferredconsole"
  # (uke patches/xnu-12377/uke-deferred-video-kprintf.patch), which is a different name and is
  # not in patches/xnu-27/series. The 17 line keeps the braveark- spelling because its tree
  # carries the matching patch; this line does not, so passing it here was a no-op.
  # "-bravearkdeferredconsole",
  # u128..u159 ran a USB CDC ACM bring-up here (muyu_usb=1 / muyu_usb_panic=1), 29 rounds without a
  # working enumeration. The driver, its build hook and these arguments were all removed on
  # 2026-11-08; the panel and the heartbeat are the channel. See docs/ABANDONED-CHANNELS.md.
  # Boot log into the board ramoops record; Android pstore reads it back as
  # /sys/fs/pstore/console-ramoops-0 after the reboot (no root needed).
  # ShengUfs adopts the controller the firmware left running and, for probe 9,
  # leaves the console log in the unused tail of vendor_boot_a.
  # native-ufs-probe=9 is the read-only GPT survey: it panics on purpose to print the
  # table. The table was verified on 2026-10-24 (super 33000-2d2fff, userdata
  # 2d3000-3b147fa), so the probe stays off for normal boots.
  # "native-ufs-probe=9",
  # 11 = after the root image is flashed: manifest + each window's GPT (read-only).
  # "native-ufs-probe=11",
  # Panic with the full root-publication diagnostics (stage, reason, media text).
  # ShengUfs is built with --unverified (no NATIVE_VERIFIED_BLOCK), and in that build
  # root publication refuses to run unless this says so ("signed window identities
  # rejected" otherwise).
  "native-ufs-allow-unverified=1",
  # 2026-11-06: the version-2 manifest now parses (2 windows + OS.vroot/SystemOS.vroot data
  # objects) and publication gets to "root window preparation failed"; this makes the failure
  # path panic with stage=<exact step> result= verify=<vr_open status> instead of one sentence.
  "native-ufs-diagnostics=1",
  # The firmware UFS driver leaves the SMMU stream mapping in place; repoint it
  # instead of panicking (NativeUFS.cpp "conflicting UFS stream mapping").
  "native-ufs-smmu-takeover=1",
  # Publish the root image (SHNGROOT manifest in userdata) as block devices so the
  # kernel can mount APFS. Requires the userdata root image to be flashed.
  # 2026-11-06: this is what starts the source-storage subsystem, and its start calls the
  # __GLOBAL__sub_I_* initializers that register NativeUfs / NativeRamBlock with OSMetaClass.
  # Without it the bundle is linked but no class is registered, so IOKit logs
  # "Couldn't alloc class \"NativeUfs\"" for every match and nothing publishes the volumes.
  # 2026-11-06: the gate SourceStorage.cpp actually reads is "muyu-source-storage" (the device
  # prefix keeps a 17-line boot out of this code); native-source-storage is a different, uke-side
  # name — it is parsed by UniXNU-uke/package/SourceStorage.cpp, not by this repo's copy. Passing
  # it here did nothing; removed 2026-11-08. With the right one,
  # native_source_storage_start() registers the built-in classes and then
  # creates/attaches/starts the UFS service against IOPlatformExpertDevice itself.
  "muyu-source-storage=1",
  "native-ufs-root=1",
  # Bring-up aid: park the CPU after a panic instead of restarting, so the panic
  # text stays on the panel long enough to be read or photographed.
  # NOT WIRED on the 27 line (checked 2026-11-08): the only patches that parse this are
  # zzzzzzzzz-braveark-hold-reboot.patch and zzzzzzzzz-braveark-hold-restart.patch, and both
  # live in patches/xnu/ (the 17 line's directory, not this one) — they were never listed in
  # patches/xnu-27/series. It was live on the
  # 17 line (u88 used it). Consequence here: a 27-line panic reboots and the panel loses the
  # text, which is the one thing the panel-only channel cannot afford. Wiring these two back in
  # (as a pair) is the first item of the screen re-plant, docs/SCREEN-ONLY.md §4.
  # "braveark-hold-reboot=1",
  "kt_fixed_zones=120",
  # "offline-legacy-register=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-gop=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-unit-scale=2",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-pm=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-validate=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-transfer=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-cpu-present=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-legacy-default-surface=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # The scanout region is DRAM: map it write-combining instead of Device-nGnRnE (2026-10-25: the device
  # stores of the frame copy are what cap the compositor at a few frames per second). 0 restores the old
  # mapping.
  # "offline-legacy-wcomb=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # Recover a transferred swap that never retires (its latch otherwise stops every later kick and the
  # client waits in it forever). 0 disables the recovery.
  # "offline-legacy-stall-guard=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  "offline-hid-home=1",
  "offline-hid-input=1",
  # Touch digitizer: ShengHidInput arms its HID digitizer source when this is 1 and reads the finger set
  # that the muyu frame pump publishes (native_touch_seq seqlock, twelve slots).
  "sheng-touch-hid=1",
  # Separate digitizer-only HID service (primary usage Digitizer/Touch Screen, product "Offline touch
  # digitizer"): with touch-hid alone the digitizer collection rides on the keyboard device, and on
  # 2026-10-25 20:57 that sent 401 HID reports (k=1 h=401) that iPadOS never turned into touches.
  # 2026-10-25 21:51: **the split digitizer service never dispatches** - with it on, `disp=0/0` in the drv rows
  # (2050 reports sent, wrapped dispatchEvent never entered, UI dead). With it OFF the digitizer collection rides
  # on the keyboard device, exactly as sheng's board.toml does it, and iPadOS reacts to the finger. Keep it off.
  # "sheng-touch-split=1",
  # "offline-legacy-phase=4",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # 2026-10-27 pm: the heartbeat measured exactly 60 swaps per minute (1.0 Hz) - one frame per second, and
  # 1 s is the compositor's swap-wait timeout, i.e. it never gets a vsync. sheng's board sets
  # sheng-vsync=144; this port never set it at all. Without it the whole UI (and the boot progress
  # animation, which advances per presented frame) crawls. The GOP scanout has no vblank, so the driver's
  # work-loop timer sends the family's vsync message instead.
  "sheng-vsync=60",
  # "offline-mobile-graphics-client=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-mobile-graphics-load=1",   # 2026-11-06: off for this run - the display driver takes the scanout and shears the panic text
  # "offline-apfs-load=1",   # 2026-11-06: the panic sits between bsd_init +0x60 and +0x5c8; these three
  # runtime kext loads (and our checkpoints right after them) are in that window.
  "-apfs_shared_datavolume",
  "offline-key-events=1",
  # physical power/vol-down/vol-up as HID Consumer (package/ButtonProbeMuyu.cpp); first boot: PON only,
  # vol-up skipped until PPID known.
  "muyu-buttons=1",
  # The USB CDC ACM console arguments used to sit here (duplicated from board.toml). Removed
  # 2026-11-08 with the rest of that channel: docs/ABANDONED-CHANNELS.md.
  "sheng-log=1",
  # 2026-10-28: persistent-log WRITER. The "bsd/dev/muyu_pstore.c" named here originally was a
  # separate writer that never worked (magic=0, bytes=0) and was deleted with the debug patch on
  # 2026-11-08; what implements sheng-log today is package/BootLog.c + package/BravearkLastLog.c.
  # The console text goes into the device tree's ramoops_region @0xa7000000; after a warm reset the
  # stock Android recovery kernel validates that record and exposes it as
  # /sys/fs/pstore/console-ramoops-0, which stock recovery's unauthenticated adbd can pull. That is
  # the official "recovery reader" path from unixnu.com/porting/log-capture (stage 4).
  # 2026-10-29: DISABLED. The known-good image fw/vendor_boot_btn2.img does not carry this argument,
  # and every image built after this line was enabled (fa179e5, 2026-10-28) stopped at the Apple logo.
  # The pstore writer itself never worked on this board (HANDOFF-2026-10-27 section 28.5: magic=0
  # bytes=0), so re-enable it only together with a working reader experiment.
  # "muyu_pstore=1",
  # 2 = keep Data writes in the persistent store window at the end of userdata (ShengUfs store +
  # RamBlock overlay); pairs with [payload.adt] persistent_data = true and a large seed.
  # 2026-10-27: ephemeral Data (sheng configuration). With AKS published the boot reaches the
  # progress bar; the persistent store is what leaves it stuck at the end.
  "sheng-data-persist=2",
  # 2026-10-26 19:15: experiment 5 (sheng-data-reset=2 + sheng-lite=1) did NOT get past the upgrade gate
  # ("Swipe up to upgrade" again), and reset=2 erases the persisted Data overlay on every boot - a
  # landmine for the next session. Back to the working baseline: original seed + persistent store, no
  # reset, no lite. Re-enable only for a deliberate one-boot experiment.
  # "sheng-data-reset=2",
  # "sheng-lite=1",
  # Owned AppleKeyStore (AppleKeyStoreState): answer libaks truthfully - no keybag, no passcode.
  # Without these two the port has no AppleKeyStore at all and PreBoard asks for a passcode forever.
  "sheng-aks=1",
  # sls 3 = MobileKeyBag "no passcode" (PreBoard gone; progress bar then stalls at the very end).
  # sls 0 = "unlocked" - the state migration's tail may be waiting for.
  "sheng-aks-sls=0",
  "sheng-disable-watchdogd=1",
  # -1 disables the Apple ARM watchdog timer kext (the genuine Apple boot argument).
  # uke: the reset moved later with this set, so the kernel timer is one of two sources;
  # the other one is watchdogd, handled by CONFIG_XNU_WATCHDOG_POLICY + sheng-disable-watchdogd.
  "wdt=-1",
  # 2026-11-06: one CPU for this run. The PAC trap is in the IRQ return path
  # (_sleh_irq+0x94 retab, ESR key IB) with x30 reloaded as a function entry;
  # single-CPU separates the timer/device IRQ path from the IPI path.
  "sheng-smp=0",
  # Bring-up dump: ten minutes into userland, panic with the display-path counters and the kept kernel
  # messages. Timed rather than marker-based: the first ReportCrash of a boot can come well before the
  # lock screen (2026-10-25 09:16: an 82 s marker put the dump at 142 s, before any display client), and
  # marker+delay then parks the machine before the interesting phase. The dump always starts with one
  # DISP line (map/val/acc/rej/xfer/ret/cl/stall/fail/last_xfer/last_ret).
  # Bring-up dump after eight minutes: long enough to see whether the lock screen stays visible now
  # that the kernel text console is parked once the render server has presented a frame.
  # 2026-10-25 17:00: at 60 s the panic screen was overpainted by the display client's next frame, so the
  # dump has to come later (stage 24 measurements are unchanged).
  # Bring-up: the muyu touch probe (package/TouchProbeMuyu.cpp). Stage 1 only reads GCC/TLMM/wrapper/SE
  # state and writes nothing; run it first and look at the "MUYU TOUCH" rows in the dump.
  # 2026-10-25 13:42, UEFI probe: the S4 branch is OFF at BDS (0x52008 bit 26 clear, CBCR 0x183bc bit 31
  # set), voting bit 26 turns it on, and GENI init writes then succeed in the firmware. Stages 6-9 give
  # the kernel the same vote and then one more write per stage: 6 = GCC vote only, 7 = + SE4 0x28
  # write-back, 8 = + SE4 0x618, 9 = + full GENI init and nvt_identify.
  # 2026-10-25 16:40, stage 22: gpio0 (outside tlmm-vm-gpio-list) vs gpio16 (MISO, inside it) run the
  # same output/pull sequence with every ctl and io readback printed; then CS is driven from the pin
  # controller (gpio19 held low) while the engine clocks four different 8-byte patterns.
  # 2026-10-25 17:05, stage 23: hand-clocked (bit-banged) Novatek id frame, no GENI at all; then the
  # same frame after releasing each tlmm-vm-gpio-list line that is not an SPI lane or the IRQ (44,45,46,
  # 47,29,177,128,129,131,77,78) in case the controller's reset or power enable is one of them, and the
  # ramoops region of the stock DTB for the Android touch driver's own probe lines.
  # 2026-10-25 17:15, stage 24: pull-up settling at 0.1/1/10/100 ms on the five pads; the engine's own
  # SPI_CS assert/deassert with the lanes muxed (does the command reach gpio19 at all); all 24 role
  # assignments of the four pads hand-clocked, in case l0..l3 as the DT names them are permuted.
  # 2026-10-25 17:20, stage 25: all 24 pin-role permutations with three reads each (signature per
  # permutation) after stage 24 found one non-zero answer at 0321, then the full vendor identify
  # sequence (engine reset, bootloader reset, page select, id read) with both chip-select polarities.
  # 2026-10-25 17:25, stage 26: the single answering role set (MISO 16, MOSI 19, CLK 18, CS 17) with
  # clock phase, MISO bias and clock rate varied, three reads each, plus the DT's own lanes as control.
  # 2026-10-25 17:30, stage 27: hold MOSI/CLK/CS at all eight idle combinations and read gpio16 with a
  # pull-up and a pull-down, to see which pad switches the controller's output; then release each candidate
  # reset line with chip select asserted and watch that pad.
  # 2026-10-25 17:35, stage 28: does gpio16 follow gpio17's level without a clock (reset or chip select)
  # or only under clocks; then clock a full id frame on the DT lanes and count ones on all sixteen
  # tlmm-vm-gpio-list pads, to find which pad really carries the controller's data.
  # 2026-10-25 17:40, stage 29: read-only SPMI through the PMIC arbiter (cliffs addresses, same as
  # SM8550): version, APID count, a known-good SDAM read, and the PERPH_TYPE of the first 64 APIDs.
  # 2026-10-25 17:45, stage 30: read-only PMIC census over SPMI - every mapped APID's PERPH_TYPE, a
  # type histogram, and mode/enable/level of every GPIO peripheral. Nothing is written.
  # 2026-10-25 17:52, stage 31: for every PMIC GPIO that is not enabled, make it a digital output, drive
  # it high (then a low pulse), wait, and read the Novatek id by hand; restore after each. Stops on the
  # first non-zero answer.
  # 2026-10-25 18:10, stage 32: the short five-row check to run right after a stock-Android boot (settle on
  # MISO/IRQ, id read in the DT lane order twice, in the one order that ever answered twice, and the
  # engine chip-select on the pad).
  # 2026-10-25 18:35, stage 33: the mode/rate matrix redone with setSpiPins() first - every earlier
  # serial-engine test except stage 16 ran with the four SPI pads still in their boot state.
  # 2026-10-25 19:10, stage 34: after the id, does this part run a firmware of its own? The event buffer and
  # gpio54 are sampled before anything is written, again after nvt_identify() resets the part into its ROM,
  # then the three start-scanning steps one at a time and a one-second THP header poll. A ROM bootloader
  # waiting for a download answers the id and nothing else (reset_state 0xa0..0xaf).
  # 2026-10-25 19:40, stage 35: hand the part a firmware (sheng's stage 4 flow). The image comes from
  # .cache/firmware/novatek/<default>.bin via scripts/gen-touch-firmware.py; right now that is the public
  # NT36532E image (see PROVENANCE.md next to it), because muyu's own vendor firmware is a
  # request_firmware() file in /vendor/firmware that no unprivileged path on the device can read.
  # If the download fails in the reset-state handshake the stage retries once with the other event-buffer
  # map (a ROM answers ENB_CASC with 0, i.e. "cascade", whatever the board really is).
  # 2026-10-25 20:30: the dump-time probe is OFF and the frame pump runs as a kernel thread instead
  # (muyu-touch-drv=1, below): the thread brings the part up once at ~45 s, then polls and publishes finger
  # sets through the whole session, so a touch reaches iPadOS instead of only printing rows at dump time.
  # Running both would fight over the same part (the probe downloads firmware again), so only one is on.
  # (no "muyu-touch": its absence keeps the dump-time probe inert; the driver thread below replaces it)
  "muyu-touch-drv=1",        # the pump waits 45 s by itself (muyu-touch-delay overrides)
  # 2026-10-26 12:45: the lock-screen diagnosis. The dump buffer is only 2401 bytes, so the touch pump goes
  # quiet (muyu-touch-quiet) and the filter is narrowed to the processes that decide whether the
  # "Swipe up to upgrade" / passcode flow can finish.
  # 2026-10-26 19:40: the live-Data probe (package/MuyuDataProbe.c) prints "MUYU DATA" rows; the touch
  # pump has its own 30 s cadence, so the filter only needed the MUYU prefix (cmdline is at its limit).
  #
  # 2026-11-02: DROPPED for the boot-determinism work. Three of five boots on this date left through the
  # critical-exit hook (BravearkLastLog.c muyu_panic_with_log) with PROC n=3 and no backboardd, and the
  # MUYU-only filter hid exactly the lines that would say why. Without this argument muyu_build_dump()
  # keeps everything except muyu_noise()'s known spam, so the dump carries the last ~2.4 KiB of the real
  # boot log. It also frees 21 bytes of the 1000-byte cmdline budget. Re-add it when the dump is only
  # wanted for the GPU/thermal probes again.
  # "muyu-dump-keep=MUYU",
  "muyu-data-probe=2",
  # Keep the pump's rows out of msgbuf so the probe rows survive to the dump.
  "muyu-touch-quiet=1",
  # 2026-10-27 pm: the boot stops creating processes at ~75 s, with mediaanalysisd/photolibraryd/
  # photoanalysisd/softwareupdated among the last ones on an empty photo library and no network.
  # That is exactly the batch sheng disables for bring-up (see package/BootWatchdogPolicy.c), and
  # no boot task ever completed past them. Disable the batch and watch the bar.
  # "sheng-lite=1",
  # 2026-10-27 18:20 bisect: sheng-lite-mask selects entries of lite_jobs by bit (bit 0 = identityservicesd,
  # same order as the table in package/BootWatchdogPolicy.c). 0x1fffff = all 21 = the known-good sheng-lite
  # baseline; each later round only changes this number, so a round costs a payload build, not a kernel build.
  "sheng-lite=1",
  # 2026-10-28: the mask is redundant while sheng-lite=1 already stops all 21 (lite appends the whole
  # list, the mask appends its subset again). Dropped so the instrumented build spends its last
  # cmdline bytes on muyu-dump-at instead: 979 -> 971 B of the ~1000 B budget.
  # "sheng-lite-mask=0x1fffff",
  # 2026-10-27 pm: heartbeat every 60 s, one short line each, so the 2401-byte panic text holds a trend
  # instead of a single instant: t, process count, launchd/backboardd/SpringBoard states, display swaps
  # and the uptime of the last one, AKS opens/calls, and the files the setup/migration flow touches.
  "muyu-data-hb=20",
  # 2026-10-27 pm: the bar stalls at 80-90% after several minutes now, so the probe has to look at the
  # machine AFTER that, not 70 s in. Probe at 330 s, dump at 360 s: both land in the stalled state.
  # 2026-10-27 pm: 5 s before the dump. At 180 s the probe rows were already pushed out of msgbuf by
  # the touch pump, so the dump showed only the heartbeats.
  "muyu-data-delay=100",
  # "muyu-touch-quiet=1",   # dropped 2026-10-27: cmdline budget (touch pump lines are not in the keep list)
  # 2026-10-26 22:50: the official skip-setup path (this + --skip-setup) did not even reach the boot logo,
  # so it is disabled again. It needs a profile/browser check before another try.
  # "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.iconservices.iconservicesagent",
  # 2026-10-26 13:07: the touch pin interrupt stays OFF. Two boots measured it: `irq=1/0` (armed, never
  # fired) and, worse, the panel stopped advancing its frame counter after the arming writes. Polling is
  # the working configuration; the readback diagnostics stay in the code for a future attempt.
  # "muyu-touch-irq=1",
  # 2026-10-27 pm: back on, with the stackshot count-drift panic fixed (patches/xnu/zzzzzzzzzzzzz), so the
  # dump text actually reaches the panel instead of an assertion. The 360 s dump showed a healthy machine
  # with the bar half way; at 1200 s the bar was nearly full but the text was painted over within a frame
  # (see native_legacy_swap_hold). 1500 s: close to the "stuck at the very end" moment, and now stable.
  # 2026-10-28 evening, third try: the timer now starts in the display probe (LegacyDisplayProbe.cpp), not in
  # load_init_program, so 20 s lands at ~t+30 s -- before backboardd presents its first frame. Earlier
  # value 150 s was too late. Once the mobile-graphics client owns the scanout
  # the kernel text console is drawn through a 90-degree rotation, so every line becomes a vertical
  # column and the page is unreadable (photo logs/2026-10-28-18-11-01-730.jpg). Freezing at 5 s takes the
  # panel before that client starts, which is the orientation the console renders correctly in (see the
  # 17:58/17:59 photos of the failed boot: horizontal, readable). Costs the UI view, keeps the
  # measurement: the ticker's t=/irq=/rep= and the heartbeat's n=/sb= still say what the machine does.
  # 2026-10-28: OFF for the UI run. Freezing the panel is useless here: after the display probe the kernel
  # console is already drawn shrunk + rotated 90 degrees, so the dump is an unreadable wall of columns
  # (photos logs/2026-10-28-18-11-01-730.jpg, shot1814.jpg). The acceptance test for the buttons is the
  # system UI itself: power -> power menu, volume-down -> volume HUD.
  # "muyu-dump-at=20",
  # Bring-up: a synthetic Home press resets the idle timer and (on this port) wakes the panel, so the
  # display does not stay blanked after the first lock screen when no touch exists yet. First press 90 s
  # after the second presented frame, then every 60 s, six times.
  # "offline-hid-auto-home=90",   # dropped 2026-10-27: unattended-test automation, cmdline budget for the AKS probe
  # "offline-hid-auto-home-count=6",   # dropped 2026-10-27: unattended-test automation, cmdline budget for the AKS probe
  # "offline-hid-auto-home-interval=60",   # dropped 2026-10-27: unattended-test automation, cmdline budget for the AKS probe
  # Off with sheng-smp=0: no other core to signal, so no SPI-pended IPI is sent.
  "armcpu-spi-ipi=0",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
]

[payload.adt]
tool = "scripts/make-muyu-adt.py"
chip_id = "207"
# 256 MiB (uke's value) is not enough: with the Data volume and union SystemOS mounted, launchd's
# boot tasks push the kernel window to 165 free pages and jetsam kills liveactivitiesd (2026-10-24
# 19:30, LASTLOG dump). 1 GiB fixed that (10+ minutes up, Apple logo, APFS xid 29170); this is the
# value umi uses on the same donor image.
# Boot speed matters more than headroom here: the SystemBoot coalition's boot tasks are killed with
# SIGTRAP when they overrun their deadline, and the 4.6 GiB window made early boot much slower than
# the 3 GiB one that actually reached the lock screen (2026-10-25 measurement).
owned_memory_size = "0x130000000"     # 回到 4.75 GiB：2/3 GiB 都救不了 boot-task 超时（§36.4）
# 2026-11-06: the 27 root image (built from 24A446) carries OS volume 2F8E6EED-68D5-4261-B8A3-12571BAA2DD4,
# the same value [root] os_volume_uuid pins. The previous value was the 17 line's volume, so
# IOFindBSDRoot() could never have matched the root media.
root_match_volume_uuid = "2F8E6EED-68D5-4261-B8A3-12571BAA2DD4"
# 2026-11-03 night (upstream correction, see UniXNU/scripts/check-mount-phase-checkpoints.py): the
# original OS runs `mount -P 1` with env 0 because no user-device-tree fstab exists, and then a missing
# Data volume and a missing /private/preboot bindfs source are only warnings. The only fatal input for
# `mount -P 1` is /chosen/boot-manifest-hash. Shipping a /filesystems node raises env to 1 and makes all
# of those fatal, which is what forced the preboot fixture, the fake Data volume and the fsck gate
# (workspace handoff sections 32-34). filesystems = false restores upstream's shape.
filesystems = false
# 2026-11-03 (evening correction): /chosen/boot-uuid stays the root volume UUID. The boot container
# is the one holding the mounted root, and its volume table has exactly one volume - System, role 1
# (scripts/inspect-apfs-image.py over the flashed image). The Data seed does carry role 0x40 (live
# checkpoint block 545587, xid 6) but in a different container, so no boot_uuid value makes a Data
# fstab entry resolve. Keep fstab to the roles the boot container really has; the mount syscall
# trace (patches/xnu/zzzzzzzzzzzzzzzzz-mount-syscall-trace.patch) then says what mount(2) fails on.
# mount(8) phase 1 ends with a bindfs mount whose source is
# /private/preboot/<hex(boot-manifest-hash)>/usr/standalone/firmware (see the /sbin/mount
# disassembly in the workspace handoff, section 33). In the normal environment (e-apfs = 1) an
# ENOENT on that source is fatal: mount exits sysexit_np(ENOENT) = 66 and launchd fails the
# `mount-phase-1` boot task. The root volume is mounted read-only at runtime, so the directory has
# to be baked into the flashed root image; scripts/rebuild-userdata-image.py does that for this hash
# (root image `fw/userdata-root-preboot.sparse`), and mount then bind-mounts the firmware copy over
# /usr/standalone/firmware, which is a no-op because the contents are identical.
#
# The hash itself is this port's bring-up boot-set identity (SHA-384 of "UkeBringup.BootSet.v1\0"),
# not an Apple personalization manifest. Its uppercase hex is the directory name under
# /private/preboot, so changing it means rebuilding the root image as well.
boot_manifest_hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
# With sheng-data-persist=2 the Data disk keeps its writes in a window at the end of userdata, so it
# is not ephemeral storage; the first-boot data migration (datamigrator) then runs and the staged
# system apps install. Costs the `ephemeral-storage` ADT property (make-muyu-adt.py --persistent-data).
# 2026-10-26: persistent=false (ephemeral) hangs at the logo on muyu (big seed needs the store-backed
# path); restored to true. Migration bypass is being pursued without ephemeral.
persistent_data = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; [bootimg.image] would override them.

# The stock ABL powers the panel off when the device tree has no splash region, so add it.

# The stock vendor_boot DTB has no splash region; the ABL powers the panel off without one.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

# The ABL loads the vendor_boot vendor ramdisk at 0x1000000; the payload volume is there.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = ["0x1000000"] },
  { name = "linux,initrd-end", type = "x", value = ["0x6000000"] },
]

# No Apple PMGR or SEP on this SoC: report a virtual platform so AMFI does not wait for an
# ApplePMGRNub, and the native UFS root needs no sheng PMGR stand-in. This is the same answer the
# other iPadOS 27 board gives (UniXNU-uke board.toml, [adt.defaults.u32] "vmm-present" = 1) and it is
# what makes build-sheng-platform-power.py unnecessary here.
[adt.defaults.u32]
"vmm-present" = 1

# The hardware tree the ADT generator compiles (schema 2): memory, CPUs, PSCI, GIC and the UFS anchor.
# Values are the ones the working iPadOS 17 image already declares (scripts/make-muyu-adt.py).
[device_tree]
source = "device:dts/muyu.dts"
