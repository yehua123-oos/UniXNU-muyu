  # If the freeze moves or disappears, Metal/AGX is the source; if it stays at
  # 175-186 s, the GPU-config freeze is independent of the Metal client.
  # Restore this line (and the --kernel-arg) to return to the fix166 baseline.
  "sheng-gpu-metal=1",
  # 2026-11-13 23:2x: the addon carries the NativeAdrenoMetal plugin bundle, and fix18's METAL row proved the accelerator itself is fine
  # (s5/0 r1 = publishMetal finished, AGXAccelerator registered) while "a0.ffffffff" said the addon had never been mounted and o0/0/0 said
  # no process had opened it. The mount is gated on this argument (zzy-native-gpu-addon-mount.patch:299) and the image comes from
  # --gpu-addon fw/gpuaddon-17-full.bin. The command line is now 999 B of the 1000 B limit.
  # "sheng-gpu-addon=1",   # fix190: off (same as fix187/188/189) so only the GX step is variable
  # 2026-11-16 08:1x fix169 (GPU-HANDOFF.md §69.156) A/B CONTROL: OFF. fix167 took
  # the Metal accelerator out and fix168 took the GPU scanout hand-off out; the
  # machine still froze at 174.5 / 175.6 s in both, with the same 233 s window. What
  # is left on the GPU side is this: gpb_run() (GCC/GPUCC/CX power), the GMU cold
  # start, the GPU SMMU takeover and the CP bring-up. The mechanism that fits an
  # all-core freeze with no printf at all is a bad GPU-SMMU context bank: every
  # later access that goes through that SMMU stalls in the interconnect, so no core
  # retires an instruction and the Gunyah watchdog is the only thing left to fire.
  # Removing this argument leaves the display on the CPU copy path (already the
  # case since fix168, pres=0) and the addon mount untouched.
  # Interpretation: survives past 250 s => the poison is in the GPU power/SMMU
  # bring-up; still ~175 s => it is not the GPU at all and the freeze belongs to
  # the mobile-graphics client / memory / thermal side.
  # "sheng-gpu-power=9",
  # 2026-11-16 08:4x fix172 (GPU-HANDOFF.md §69.157) STAIRCASE STEP 2: level 6. fix171 proved
  # level 3 does NOT freeze (250 s+, no reset) but the touch panel died, so the poison is in 4..9.
  # Level 6 = 3 plus the GMU clock bring-up of gpb_gmu_clocks_on: GPLL0 GPU votes, gpucc PLL0/PLL1
  # configuration, PLL1 enable, hub 200 MHz / gmu 220 MHz, the GMU branches. The GMU itself stays in
  # reset and GX/CP are still untouched (that starts at 7/8/9). Interpretation: freeze => poison in
  # 4..6 (GMU context / read-only prerequisites / clock bring-up), next 4 or 5. No freeze => poison
  # in 7..9 (GMU cold start / GX power / hw_init+CP), next 8.
  # Early touch reading (only when the round boots): if touch works at 6 but not at 3, the 3-only
  # failure was probably the transient of bringing CX up without the GMU clocks; if touch fails at
  # 6 too, treat the touch loss as independent of the ladder (§69.156.3).
  # 2026-11-16 fix206: 9 -> 7 for the coldstop bisect, and only this changes against fix175 (which ran
  # power=7 + coldstop=2 and kept the compositor producing frames: OFFER n=192 in 357 s, against 3 offers
  # for the full cold start in fix174). So the killer is in stages 3..5 of ShengGmuLoadAndStartHfi.
  "sheng-gpu-power=9",
  # fix190 (2026-11-16 11:3x): fix189 proved GX does power on (kGxStatus 3 -> 0, GX GDSCR f8222800,
  # OOB ack in 400 us) and that the failure starts exactly at the kH2gSet bit30 write, yet the system
  # keeps ticking for 400 s with no touch frames and SpringBoard spinning at 13k wakes/s. So the bench
  # in gpuOn() times 4000 MMIO reads before and after that one write, and prints the CX GDSCR with each.
  # --kernel-arg sheng-gpu-gxstep=3 parks the probe right after step 3 (injected on the command line,
  # same as fix187/188, so the board.toml arg order and budget stay identical to fix189).
  # 2026-11-13 23:2x: back again, and this time it is diagnosis-critical. Without it the kprintf ring is the 128 KiB default and the
  # fix17 window started at 122 s: every GPU-probe row from 41-122 s (the addon stage, the Metal publication chance, the trust cache
  # lines) had already been evicted, so "did publishMetal() even run" was unanswerable. 1 MiB keeps the whole boot in the window.
  "msgbuf=1048576",
  # Bring-up: a synthetic Home press resets the idle timer and (on this port) wakes the panel, so the
  # display does not stay blanked after the first lock screen when no touch exists yet. First press 90 s
  # after the second presented frame, then every 60 s, six times.
  # "offline-hid-auto-home=90",   # dropped 2026-10-27: unattended-test automation, cmdline budget for the AKS probe
  # "offline-hid-auto-home-count=6",   # dropped 2026-10-27: unattended-test automation, cmdline budget for the AKS probe
  # "offline-hid-auto-home-interval=60",   # dropped 2026-10-27: unattended-test automation, cmdline budget for the AKS probe
  "armcpu-spi-ipi=1",
  "-no_slto_panic",
  # fix143 实验已结束并证伪（§69.108）：Turnip 本来就一直跑 sysmem，加
  # sheng-tu-debug=sysmem,nocb 没有任何变化。恢复原参数。
  "ml-timeout-lock-panic-scale=40",
  # 2026-11-13 22:5x: the log explains the 90-95 s death. AMFI reports "no external trust caches found (segment length is zero)" at 45.0 s,
  # so nothing on the root volume is covered by a trust cache; a moment later it rejects /sbin/launchd and /usr/lib/dyld with "adhoc signed"
  # + "unsuitable CT policy 0", and pid 1 dies. amfi=0x80 is the GET_OUT_OF_MY_WAY mask (code_signing.h), which skips trust evaluation and
  # allows any signature in one 9-byte argument; cs_enforcement_disable=1 sets both masks through the classic path as a belt. The kernel is
  # a DEBUG build, so this parse block is compiled in (kern_codesigning.c, DEVELOPMENT || DEBUG).
]

[payload.adt]
tool = "scripts/make-muyu-adt.py"
chip_id = "207"
# fix212 (2026-11-16 20:3x): /defaults/kern.maxvnodes. unix_startup() asks PE_get_default for this
# BEFORE it sizes the table from sane_size, so this one 4-byte property lifts the 1024/2048 ceiling
# with no kernel change. 66000 is what sane_size (4.67 GiB, measured by fix211's MUYU MEM line)
# would have produced on its own. Remove this line to go back to the computed value.
# fix213 A/B: maxvnodes = 66000  (commented out for the control round)
# fix224: back ON. fix223's stall census showed the system does *not* slow down and then stop: the per-5-second
# probe ticks are exactly 5.0 s apart right up to the cut, and the freeze lands 39 s after the GPU went idle
# (sub stuck at 13) — so it is a sudden, global stop, the shape of a spinlock deadlock, not of a starving
# thread. In the same window "Initiating vnode jetsam" fires 162 times (desired 1024, numvnodes 1951, 0 free
# every time): the table is half the size sane_size asks for, so the jetsam path runs flat out through the
# VM's locks while dozens of processes start. fix212 ran this value once, but on a different GPU
# configuration; with the freeze now known to be sudden rather than gradual it is worth removing the storm.
maxvnodes = 66000
# 256 MiB (uke's value) is not enough: with the Data volume and union SystemOS mounted, launchd's
# boot tasks push the kernel window to 165 free pages and jetsam kills liveactivitiesd (2026-10-24
# 19:30, LASTLOG dump). 1 GiB fixed that (10+ minutes up, Apple logo, APFS xid 29170); this is the
# value umi uses on the same donor image.
# Boot speed matters more than headroom here: the SystemBoot coalition's boot tasks are killed with
# SIGTRAP when they overrun their deadline, and the 4.6 GiB window made early boot much slower than
# the 3 GiB one that actually reached the lock screen (2026-10-25 measurement).
owned_memory_size = "0x130000000"     # 回到 4.75 GiB：2/3 GiB 都救不了 boot-task 超时（§36.4）
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
# 2026-11-03 night (upstream correction, see UniXNU/scripts/check-mount-phase-checkpoints.py): the
# original OS runs `mount -P 1` with env 0 because no user-device-tree fstab exists, and then a missing
# Data volume and a missing /private/preboot bindfs source are only warnings. The only fatal input for
# `mount -P 1` is /chosen/boot-manifest-hash. Shipping a /filesystems node raises env to 1 and makes all
# of those fatal, which is what forced the preboot fixture, the fake Data volume and the fsck gate
# (workspace handoff sections 32-34). filesystems = false restores upstream's shape.
filesystems = false
# 2026-11-03 (evening correction): /chosen/boot-uuid stays the root volume UUID. The boot container
# is the one holding the mounted root, and its volume table has exactly one volume - System, role 1
# (scripts/inspect-apfs-image.py over the flashed image). The Data seed does carry role 0x40 (live
# checkpoint block 545587, xid 6) but in a different container, so no boot_uuid value makes a Data
# fstab entry resolve. Keep fstab to the roles the boot container really has; the mount syscall
# trace (patches/xnu/zzzzzzzzzzzzzzzzz-mount-syscall-trace.patch) then says what mount(2) fails on.
# mount(8) phase 1 ends with a bindfs mount whose source is
# /private/preboot/<hex(boot-manifest-hash)>/usr/standalone/firmware (see the /sbin/mount
# disassembly in the workspace handoff, section 33). In the normal environment (e-apfs = 1) an
# ENOENT on that source is fatal: mount exits sysexit_np(ENOENT) = 66 and launchd fails the
# `mount-phase-1` boot task. The root volume is mounted read-only at runtime, so the directory has
# to be baked into the flashed root image; scripts/rebuild-userdata-image.py does that for this hash
# (root image `fw/userdata-root-preboot.sparse`), and mount then bind-mounts the firmware copy over
# /usr/standalone/firmware, which is a no-op because the contents are identical.
#
# The hash itself is this port's bring-up boot-set identity (SHA-384 of "UkeBringup.BootSet.v1\0"),
# not an Apple personalization manifest. Its uppercase hex is the directory name under
# /private/preboot, so changing it means rebuilding the root image as well.
boot_manifest_hash = "5fd2fc139b688ddf071aa815c1ea75d26bcd994a528cf02e365661eab5139ec7b580d63ca9319e218962a2236f23faca"
cpu_regs = "0,0x100,0x200,0x300,0x400,0x500,0x600,0x700"
packed_data_ramdisk = true
# With sheng-data-persist=2 the Data disk keeps its writes in a window at the end of userdata, so it
# is not ephemeral storage; the first-boot data migration (datamigrator) then runs and the staged
# system apps install. Costs the `ephemeral-storage` ADT property (make-muyu-adt.py --persistent-data).
# 2026-10-26: persistent=false (ephemeral) hangs at the logo on muyu (big seed needs the store-backed
# path); restored to true. Migration bypass is being pursued without ephemeral.
persistent_data = true
ipad_identity = true
unique_chip_id = "required"          # the platform seed is not stored in any repository

# Image parameters come from the Mu-Silicium device config; [bootimg.image] would override them.

# The stock ABL powers the panel off when the device tree has no splash region, so add it.

# The stock vendor_boot DTB has no splash region; the ABL powers the panel off without one.
[[bootimg.dtb_node]]
path = "/reserved-memory/splash_region"
props = [
  { name = "label", type = "s", value = "cont_splash_region" },
  { name = "reg", type = "x", value = ["0x0", "0xe3940000", "0x0", "0x2b00000"] },
]

# The ABL loads the vendor_boot vendor ramdisk at 0x1000000; the payload volume is there.
[[bootimg.dtb_node]]
path = "/chosen"
props = [
  { name = "linux,initrd-start", type = "x", value = ["0x1000000"] },
  { name = "linux,initrd-end", type = "x", value = ["0x6000000"] },
]
