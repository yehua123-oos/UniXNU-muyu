# Board description of the Xiaomi Pad 7 Pro (muyu, SM8635 cliffs), read by the unixnu build driver.
#
# This is the repository's official identity: format 2, iPadOS 27.0.1 (24A446) on the shared SM7675
# SoC layer, four-layer patch series. The iPadOS 17.7.11 line is the port's earlier format 1 board and
# is preserved unchanged at tag `line-ipados-17` (docs/IPADOS17-ARCHIVE.md says how to build it).
schema_version = 2

[board]
name = "muyu"
soc = "SM8635"
soc_source = "sm7675"
os_profile = "ipados-27.0.1-24A446"
description = "Xiaomi Pad 7 Pro"
kit = "muyu"                 # the package/ of this repository appears as kits/muyu in the build tree

# The target OS image comes from the OS profile (ipados-27.0.1-24A446): this board does not pin [ipsw], so the
# profile's iPad17,3 / 24A446 restore image is used, read with range requests member by member.

[components]
# schema 2 assembles only the components a board lists; the 10063 archives below address them by name.
# XnuPrelink is required: [kernel.prelink] tool points at kits/XnuPrelink/emit_prelink.py, and the
# 24A446 builders import kc_image from the same directory.
include = ["ArmDTPlatform", "ArmCpu", "RamBlock", "ShengUfs", "AppleKeyStoreState", "XnuPrelink"]

# The root images the storage builder checks (kernel.py exports these as UNIXNU_ROOT_* / XNU_OWNER_*).
# image_sha256 is the digest of the raw image the policy was built from (verification.json's
# image_sha256), NOT the .dmg.aea container digest: the container changes with its wrapper, the
# image is what the block table covers. The container digests are recorded in
# scripts/data/owner-os-policy-27.json as dmg_sha256.
[root]
os_volume_uuid = "2F8E6EED-68D5-4261-B8A3-12571BAA2DD4"
os_image_sha256 = "8a12cdad43f8f0d33dadcf01a800a560222baf40c05f71374c460ba57ba3a739"
systemos_volume_uuid = "F914C62A-AD00-47C6-8281-5746291C339A"
systemos_image_sha256 = "d5b4873d35c85f96eaafaa31c59602b485afe33b5067eff1af67ba31204cdb4a"

[userdata]
first_lba = 0x2d3000
last_lba = 0x3b147fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[adt.chosen.bytes]
# The owner boot-set identity this port publishes (scripts/gen-muyu-owner-identity.py in the device
# repository). These two values must equal owner_boot_set_hash / owner_boot_set_domain in the generated
# package/OwnerBootIdentity.h, which the root-policy loader compares against.
boot-manifest-hash = "ee2c1b5cd8ed5e8102f7a9110c8c9328eb398dbaf532ab4021f4c8996c79abb4654a3276a8e430ccc1c78e582f407e15"
owner-boot-manifest-domain = "4d7579754272696e6775702e4f776e6572426f6f745365742e763100"

[adt.chosen.u32]
# 2026-11-06: ml_unsafe_kernel_text() asserts unless ml_unsafe_kernel_text_init() found this
# property in /chosen (iBoot writes it on Apple hardware). SM8635 has no CTRR, so kernel text is
# writable and 0 is the truthful value: the init sets _unsafe_kernel_text = (0 == value) = true.
# Without it dtrace_early_init() panics with
#   machine_routines.c:3379 Assertion failed: _unsafe_kernel_text_initialized
"kernel-ctrr-to-be-enabled" = 0

[kernel]
# Four layers, in this order, each resolved into its own checkout — the same shape UniXNU-uke uses.
# A format 2 board never globs a directory: the plan is exactly these four series files.
#   arch  64 patches  UniXNU/profiles/arch/arm64e/patches/xnu/series
#   soc    2 patches  UniXNU-sm7675-common/patches/xnu-12377/series (sheng-platform-power, native-smp-secondary)
#   os     4 patches  UniXNU/profiles/os/ipados-27.0.1-24A446/patches/xnu/series
#   device 4 patches  patches/xnu-27/series                         (this repository)
# 74 total, and `unixnu status --json` prints the resolved order. Counts belong to the pinned sources:
# re-check them whenever a layer is re-pinned, instead of trusting the numbers in this comment.
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu-12377/series",
  "os:patches/xnu/series",
  "device:patches/xnu-27/series",
]
# Userland stage: the full kernel plus the owner cache/Data mounts, the RAM block
# provider (the Data seed) and the launchd watchdog policy. Under muyu-full_defconfig
# launchd has no writable /private/var (swap reports EROFS 30) and nothing holds the
# watchdog, so the console stops after load_init_program and the board resets.
defconfig = "muyu-userland_defconfig"
# Archive builders of the kernel step, in order. They run only for a configuration with
# CONFIG_XNU_BUILD_ARCHIVES=y (configs/braveark-full_defconfig), after the bootstrap pass has left the
# compile records behind. Each entry is a script of the build tree with its arguments.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-libpthread-kernel.py",
  "build-boot-log.py",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:VirtioMmioBlock",
  "component:ShengUfs",
  "component:RamBlock",
  "component:AppleKeyStoreState",
  "build-sheng-source-storage.py",
  # "build-software-aes-27.py",   # needs drivers/SoftwareAES (NativeAES.cpp + OriginalAESABI.h) and the
  #                               # SoftwareAES component entry; the launcher does not reference AES yet,
  #                               # so it is off until the 27 storage path actually wants the AES subclass.
]

